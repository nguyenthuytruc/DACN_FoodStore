version: '3.9'
services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "5173:5173"
    volumes:
      # - ./client:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - backend

  backend:
    build:
      context: ./FoodStore
      dockerfile: Dockerfile
    ports:
      - "7093:7093"
    # volumes:
    #   - ./FoodStore:/app
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:7093
      - ConnectionStrings__DefaultConnection=Server=db;Database=DACS_QuanLyCuaHangAnUong;User=sa;Password=yourStrong(!)Password;Encrypt=False
    depends_on:
      - db

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: foodstore_db
    ports:
      - "1435:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=yourStrong(!)Password
    volumes:
      - mssql_data:/var/opt/mssql

  init_db:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      - db
    environment:
      SA_PASSWORD: "yourStrong(!)Password"
    volumes:
      # Mount file scriptdb.sql vào container init_db
      - ./scriptdb.sql:/scripts/scriptdb.sql
    # Lệnh chạy: chờ khoảng 20 giây cho DB khởi động, rồi chạy sqlcmd để thực thi script
    command: /bin/bash -c "sleep 20 && /opt/mssql-tools/bin/sqlcmd -S db -U sa -P 'yourStrong(!)Password' -i /scripts/scriptdb.sql"

volumes:
  mssql_data:

